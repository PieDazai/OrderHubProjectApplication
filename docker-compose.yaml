version: "3.8"

services:
  postgres:
    image: postgres:17.6
    container_name: postgres_orderHub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB}

    restart: unless-stopped

    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "wal_level=logical"

    networks:
      - orderhub-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: .       # Текущая директория
      dockerfile: order-service/Dockerfile        # Используем наш multi-stage Dockerfile
      args:
        # Аргументы сборки (только метаинформация, НЕ секреты!)
        APP_VERSION: ${APP_VERSION:-1.0.0}  # Версия приложения для меток в образе
        # ВНИМАНИЕ: Пароли НЕ передаём в ARGS! Они останутся в образе.
    container_name: order_service
    ports:
      - "${ORDER_SERVICE_PORT:-8080}:8080"           # Проброс порта наружу
    environment:
      # Сервер
      SERVER_PORT: 8080

      # -----------------------------------------------------------------------
      # Подключение к БД (runtime)
      # -----------------------------------------------------------------------
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}  # Секрет!

      # -----------------------------------------------------------------------
      # Для миграций и прямых запросов (если нужно внутри приложения)
      # -----------------------------------------------------------------------
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}           # Секрет!

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      # -----------------------------------------------------------------------
      # JPA настройки
      # -----------------------------------------------------------------------
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}  # validate в production

      # -----------------------------------------------------------------------
      # Метрики и мониторинг (для Prometheus)
      # -----------------------------------------------------------------------
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"  # Включаем экспорт в Prometheus
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics,loggers

      # -----------------------------------------------------------------------
      # Логирование (опционально, для отладки)
      # -----------------------------------------------------------------------
      LOGGING_LEVEL_COM_ORDERHUB: DEBUG  # Детальные логи

      # Трассировка OpenTelemetry
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

      SPRING_PROFILES_ACTIVE: elk
      ENVIRONMENT: production

      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy  # Ждём, пока PostgreSQL полностью готов
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - orderhub-network

  notification-service:
    build:
      context: .       # Текущая директория
      dockerfile: notification-service/Dockerfile        # Используем наш multi-stage Dockerfile
      args:
        # Аргументы сборки (только метаинформация, НЕ секреты!)
        APP_VERSION: ${APP_VERSION:-1.0.0}  # Версия приложения для меток в образе
        # ВНИМАНИЕ: Пароли НЕ передаём в ARGS! Они останутся в образе.
    container_name: notification_service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8082}:8082"           # Проброс порта наружу
    environment:
      # Сервер
      SERVER_PORT: 8082

      # -----------------------------------------------------------------------
      # Метрики и мониторинг (для Prometheus)
      # -----------------------------------------------------------------------
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"  # Включаем экспорт в Prometheus
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics,loggers

      # -----------------------------------------------------------------------
      # Логирование (опционально, для отладки)
      # -----------------------------------------------------------------------
      LOGGING_LEVEL_COM_ORDERHUB: DEBUG  # Детальные логи

      # Трассировка OpenTelemetry
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      SPRING_PROFILES_ACTIVE: elk
      ENVIRONMENT: production

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy  # Ждём, пока PostgreSQL полностью готов
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - orderhub-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8083}:8083"
    environment:
      # Сервер
      SERVER_PORT: 8083

      # Метрики для Prometheus (опционально)
      MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics

      # Трассировка OpenTelemetry
      MANAGEMENT_TRACING_ENABLED: "true"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces

      SPRING_PROFILES_ACTIVE: elk
      ENVIRONMENT: production

      #kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - orderhub-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus_orderhub
    volumes:
      # Конфигурация Prometheus (скажем, куда ходить за метриками)
      - ./order-service/src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Данные метрик (чтобы не терять историю при перезапуске)
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'  # Храним метрики 15 дней (production standard)
    ports:
      - '9090:9090'  # UI Prometheus (только для отладки)
    restart: unless-stopped
    networks:
      - orderhub-network

    # ---------------------------------------------------------------------------
    # Grafana - визуализация дашбордов
    # ---------------------------------------------------------------------------

  grafana:
    image: grafana/grafana:10.2.2
    container_name: grafana_orderhub
    volumes:
      - grafana_data:/var/lib/grafana  # Сохраняем дашборды и настройки
    environment:
      # Учётка для первого входа (обязательно поменять в production!)
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Дополнительные плагины (например, для круговых диаграмм)
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - '3000:3000'  # UI Grafana
    depends_on:
      - prometheus  # Логически зависит, но технически может работать без него
    restart: unless-stopped
    networks:
      - orderhub-network

  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: jaeger
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Храним трассы в памяти (для демо), в production нужен persistent storage
      SPAN_STORAGE_TYPE: memory
    restart: unless-stopped
    networks:
      - orderhub-network

  # =============================================================================
  # ELK СТЕК - структурированное логирование
  # =============================================================================
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: elasticsearch_orderhub
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.monitoring.collection.enabled=true
      - "cluster.name=orderhub-elk"
    ports:
      - "${ELASTICSEARCH_PORT}:9200"  # HTTP API
      - "9300:9300"  # Transport protocol
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - orderhub-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200/_cluster/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # Elasticsearch Exporter для мониторинга в Prometheus
  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: elasticsearch_exporter_orderhub
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'                 # Собирать метрики со всех нод
      - '--es.indices'             # Собирать метрики по индексам
      - '--es.indices_settings'    # Собирать настройки индексов
      - '--es.shards'              # Собирать метрики по шардам
    ports:
      - "9114:9114"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orderhub-network

  logstash:
    image: logstash:8.11.0
    container_name: logstash_orderhub
    ports:
      - "${LOGSTASH_PORT}:5000"   # TCP input для логов
      - "9600:9600"               # Monitoring API
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      # Параметры подключения к Elasticsearch
      ELASTICSEARCH_HOSTS: "http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orderhub-network

  kibana:
    image: kibana:8.11.0
    container_name: kibana_orderhub
    ports:
      - "${KIBANA_PORT}:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://${ELASTICSEARCH_HOST}:${ELASTICSEARCH_PORT}"
      # Локализация
      I18N_LOCALE: ru
      # Настройки по умолчанию
      KIBANA_DEFAULT_APP_ID: discover
      SERVER_NAME: kibana_orderhub
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - orderhub-network

  # Опционально: Filebeat для сбора логов из файлов (альтернатива TCP)
  filebeat:
    image: elastic/filebeat:8.11.0
    container_name: filebeat_orderhub
    user: root
    volumes:
      # Конфигурация Filebeat
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Docker socket для чтения логов контейнеров
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Логи Docker
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: [ "--strict.perms=false" ]
    depends_on:
      elasticsearch:
        condition: service_healthy
      logstash:
        condition: service_started
    restart: unless-stopped
    networks:
      - orderhub-network

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"   # PLAINTEXT для внешних подключений (хост, инструменты)
    environment:
      CLUSTER_ID: ${CLUSTER_ID}   # ваш UUID
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      # Два протокола: внутренний для Compose и внешний для хоста
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,PLAINTEXT://host.docker.internal:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"


      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"

      # Параметры для single‑node
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 5000
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"

    networks:
      - orderhub-network

    extra_hosts:
      - "host.docker.internal:host-gateway"   # резолвит host.docker.internal на хост (Linux тоже)
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      #test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list" ]
      test: ["CMD", "sh", "-c", "nc -z localhost 29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: orderhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"   # используем внутренний INTERNAL listener
    depends_on:
      - kafka
    networks:
      - orderhub-network

volumes:
  postgres_data:
    name: orderhub_postgres_data
  prometheus_data:
    name: orderhub_prometheus_data
  grafana_data:
    name: orderhub_grafana_data
  jaeger_data:
    name: orderhub_jaeger_data
  elasticsearch_data:
    name: orderhub_elasticsearch_data
  filebeat_data:
    name: orderhub_filebeat_data
  kafka_data:
    name: orderhub_kafka_data

networks:
  orderhub-network:
    driver: bridge