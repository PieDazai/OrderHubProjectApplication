databaseChangeLog:
  - changeSet:
      id: V1__initial__schema.sql
      author: order-hub
      sqlFile:
        path: changelog/changes/V1__initial__schema.sql
        relativeToChangeFile: true
        splitStatements: true
        endDelimiter: ;

  - changeSet:
      id: V2__add_order_number.sql
      author: order-hub
      sqlFile:
        path: changelog/changes/V2__add_order_number.sql
        relativeToChangeFile: true
        splitStatements: true
        endDelimiter:

